<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexmapper — Shared World Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: flex; background: #1e1e1e; color: #e8e8ec; }
  #canvas { flex: 1; min-width: 0; width: 0; display: block; cursor: crosshair; touch-action: none; }
  #sidebar {
    width: 232px; min-width: 232px; background: #28282d; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    border-left: 1px solid #3a3a42;
  }
  #sidebar h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.4px; }
  #sidebar h2 { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: #9a9aa6; margin-top: 6px; }
  select, button, input {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #45454f;
    background: #34343c; color: #e8e8ec; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #40404a; }
  button.active { background: #7a3030; border-color: #a04545; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    margin-right: 6px; vertical-align: -1px; border: 1px solid #00000055; }
  #terrainGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #terrainGrid button { padding: 0; height: 26px; border-radius: 4px; }
  #terrainGrid button.selected { outline: 2px solid #fff; }
  #iconGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #iconGrid button { padding: 4px; height: 44px; border-radius: 4px; }
  #iconGrid button img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #iconGrid button.selected { outline: 2px solid #fff; }
  #presence { font-size: 12px; color: #b8b8c4; line-height: 1.6; }
  #history { font-size: 11px; color: #9a9aa6; line-height: 1.6; }
  #history b { color: #d0d0d8; font-weight: 600; }
  #presence .dot { color: #6dd36d; margin-right: 5px; }
  #hint { font-size: 11px; color: #6f6f7a; line-height: 1.5; margin-top: auto; }
  #status { font-size: 11px; color: #8a8a96; }
  #toast { position: fixed; left: 12px; bottom: 12px; background: #34343ccc;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; opacity: 0;
    transition: opacity .3s; pointer-events: none; }
  #notePanel { position: fixed; left: 12px; top: 12px; width: 270px;
    background: #28282dee; border: 1px solid #3a3a42; border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #notePanel[hidden] { display: none; }
  #noteTitle { font-size: 12px; font-weight: 600; color: #e8e8ec; }
  #noteText { width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid #45454f; background: #34343c; color: #e8e8ec;
    font-size: 13px; font-family: inherit; resize: vertical; cursor: text; }
  #noteMeta { font-size: 11px; color: #9a9aa6; }
  #noteBtns { display: flex; gap: 6px; }
  @media (pointer: coarse) {
    select, button, input { padding: 12px 10px; font-size: 15px; }
    #terrainGrid button { height: 36px; padding: 0; }
    #iconGrid button { height: 56px; padding: 5px; }
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="sidebar">
    <h1>Shared World Map</h1>
    <h2>Terrain</h2>
    <div id="terrainGrid"></div>
    <h2>Icon</h2>
    <div id="iconGrid"></div>
    <h2>Tools</h2>
    <button id="panBtn">Pan / move</button>
    <button id="paintBtn" class="active">Paint terrain</button>
    <button id="iconBtn">Place icon</button>
    <button id="noteBtn">Notes</button>
    <button id="removeBtn">Remove hex</button>
    <button id="layerBtn">Add layer (ring)</button>
    <button id="centerBtn">Centre map</button>
    <button id="exportBtn">Export .hexmap</button>
    <button id="importBtn" class="dm-only">Import .hexmap</button>
    <input id="importInput" type="file" accept=".hexmap,.hexmap2,application/json" hidden>
    <button id="clearBtn" class="dm-only">Clear all</button>
    <h2>Your name</h2>
    <input id="nameInput" type="text" maxlength="32">
    <h2>Party online</h2>
    <div id="presence">…</div>
    <h2>Recent changes</h2>
    <div id="history">…</div>
    <div id="hint">move: arrows / WASD / space-drag / right-drag<br>zoom: wheel, pinch or +/−<br>notes: Notes tool, then click a hex</div>
    <div id="status">connecting…</div>
  </div>
  <div id="toast"></div>
  <div id="notePanel" hidden>
    <div id="noteTitle">Note</div>
    <textarea id="noteText" rows="5" maxlength="2000"
      placeholder="Session notes for this hex…"></textarea>
    <div id="noteMeta"></div>
    <div id="noteBtns">
      <button id="noteSave">Save</button>
      <button id="noteClose">Close</button>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
